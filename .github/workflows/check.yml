name: Check skill package

on:
  push:
  pull_request:

# CI 只读取源码并运行离线检查，不持有业务凭据或发布权限。
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_package.py
      - run: python skills/yoozy-materials/scripts/search_materials.py --help
